name: Publish release to NPM
run-name: Publish - ${{ github.ref }}

on:
  release:
    types: [published]

permissions:
  id-token: write # GitHub OIDC
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          registry-url: 'https://registry.npmjs.org'
          scope: '@videodock'
      # Ensure npm 11.5.1 or later is installed for publishing with trusted publisher (OIDC)
      - name: Update npm
        run: npm install -g npm@latest
      - name: Install dependencies
        run: yarn install
      - name: Publish to NPM
        run: npm publish --access public
